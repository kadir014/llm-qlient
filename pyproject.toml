[project]
name = "llm-qlient"
description = "Qt desktop client for interacting with local LLMs"
version = "0.0.1"
readme = "README.md"
authors = [
    {name="Kadir Aksoy"},
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 3 - Alpha"
]
dependencies = [
    "PyQt6>=6.10.0",
    "psutil>=7.2.2",
    "freshqt @ git+https://github.com/kadir014/freshqt",
    "panllm @ git+https://github.com/kadir014/panllm"
]
requires-python = ">=3.12"

license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
main = "llm_qlient.main:main"

[project.urls]
homepage = "https://github.com/kadir014/llm-qlient"
bugtracker = "https://github.com/kadir014/llm-qlient/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
